[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devora-api"
version = "0.1.0"
description = "Devora FastAPI backend"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "litellm>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src"]
exclude = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.uv]
dev-dependencies = ["pip-audit"]
