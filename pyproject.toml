[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devora"
version = "0.1.0"
description = "AI-native Developer Relations Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/sdk-python", 
    "packages/shared-types"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["apps", "packages"]
pythonVersion = "3.12"
strict = ["apps/**", "packages/**"]
