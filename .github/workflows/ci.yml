name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        cd apps/api
        uv sync --dev
    
    - name: Run linting
      run: |
        cd apps/api
        uv run ruff check .
        uv run ruff format --check .
    
    - name: Run type checking
      run: |
        cd apps/api
        uv run pyright
    
    - name: Run tests
      run: |
        cd apps/api
        uv run pytest
      env:
        DATABASE_URL: sqlite+aiosqlite:///test.db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test_secret_key_64_bytes_long_enough_for_testing
        API_KEY_HASH_SALT: test_salt_32_bytes_long_enough
    
    - name: Build Docker image
      run: |
        docker build -t devora-api ./apps/api

  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Bun
      uses: oven-sh/setup-bun@v1
    
    - name: Install dependencies
      run: |
        cd apps/web
        bun install
    
    - name: Run linting
      run: |
        cd apps/web
        bun run lint
    
    - name: Run type checking
      run: |
        cd apps/web
        bun run typecheck
    
    - name: Build application
      run: |
        cd apps/web
        bun run build
    
    - name: Build Docker image
      run: |
        docker build -t devora-web ./apps/web

  sdk-python:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        cd packages/sdk-python
        uv sync --dev
    
    - name: Run linting
      run: |
        cd packages/sdk-python
        uv run ruff check .
        uv run ruff format --check .
    
    - name: Run type checking
      run: |
        cd packages/sdk-python
        uv run pyright

  sdk-typescript:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Bun
      uses: oven-sh/setup-bun@v1
    
    - name: Install dependencies
      run: |
        cd packages/sdk-typescript
        bun install
    
    - name: Run linting
      run: |
        cd packages/sdk-typescript
        bun run lint
    
    - name: Run type checking
      run: |
        cd packages/sdk-typescript
        bun run typecheck
