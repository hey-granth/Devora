version: '3.8'

services:
  api:
    build: ./apps/api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - ./packages:/app/packages
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development

  worker:
    build: ./apps/api
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./apps/api/src:/app/src
      - ./packages:/app/packages
      - ./scripts:/app/scripts
    command: python -m rq worker --url ${REDIS_URL} devora
    environment:
      - ENVIRONMENT=development

  scheduler:
    build: ./apps/api
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./apps/api/src:/app/src
      - ./scripts:/app/scripts
    command: python -m scripts.scheduler
    environment:
      - ENVIRONMENT=development

  web:
    build: ./apps/web
    env_file: apps/web/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
      - ./apps/web/stores:/app/stores
      - ./apps/web/types:/app/types
      - ./packages:/app/packages
    command: bun run dev
    environment:
      - NODE_ENV=development

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
