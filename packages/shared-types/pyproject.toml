[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devora-shared-types"
version = "0.1.0"
description = "Devora shared Pydantic and Zod schemas"
dependencies = [
    "pydantic>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
strict = ["src/**"]
